name: claude review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: claude review
    # Forks don't get the secret, so the action would fail auth validation.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        # Advisory, never a merge gate. A turn-budget overrun or an API hiccup
        # must not red-check an otherwise good PR.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR. Prioritise correctness bugs, broken invariants,
            and API-contract changes. Skip formatting and naming nits —
            those are handled by lint. Assert that the code changes
            reflect the checklist in any present `BUILD_PLAN.md` file.

            Post the review with `gh pr comment`.
          # Read/Grep/Glob let the review read surrounding code, not just the
          # diff hunks. That costs turns, hence the raised budget.
          claude_args: >-
            --max-turns 40 --allowed-tools "Read,Grep,Glob,Bash(gh pr
            diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
