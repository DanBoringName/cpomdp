name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      # `examples` extra: `ty` covers `examples/`, so matplotlib and pillow have to be
      # resolvable or every demo import reads as missing.
      - run: uv sync --locked --extra examples
      # Cache the pre-commit hook environments, keyed on the config.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Run the same hooks contributors run locally (ruff lint + format + file
      # hygiene), so CI and pre-commit can never disagree. Fails if any hook would
      # change a file. The commit-msg hook isn't run here (no commit to check).
      - name: pre-commit
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      # `--no-sync`, or a bare `uv run` re-syncs the environment back to the
      # default set and takes matplotlib out again.
      - name: ty (strict types)
        run: uv run --no-sync ty check

  docs:
    name: docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --group docs
      # `--strict` fails on a mkdocstrings reference that resolves to nothing and on a
      # dead relative link in an `--8<--` include. `docs.yml` runs the same build, but
      # only on push to main, so without this job a page that moved is first checked by
      # the Pages deploy *after* the merge, with main already broken. No badge step and
      # no deploy here: this is the gate, not the publish.
      - run: uv run --no-sync mkdocs build --strict

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax-cache
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
    steps:
      # Full history: `tests/test_provenance_ordering.py` asks git whether each
      # registration ref is an ancestor of the ref that measured against it. A shallow
      # clone has the files and not the graph, so the whole module would skip, and a
      # test that always skips is a test that does not exist.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          # Without a per-version key the matrix shares one cache entry and only
          # the first job to save it ever populates it.
          cache-suffix: py${{ matrix.python-version }}
      - run: uv sync --locked
      # The run id keeps the key unique so every run saves what it compiled;
      # restore starts from the newest previous save. Entries are hash-validated
      # by jax, so a stale cache is a miss, never a wrong result.
      - name: jax compilation cache
        uses: actions/cache@v5
        with:
          path: .jax-cache
          key: jax-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.run_id }}
          restore-keys: jax-cache-${{ runner.os }}-py${{ matrix.python-version }}-
      # The pure-Python suite: no Julia installed, so this also proves the
      # rxinfer-marked tests deselect cleanly when the optional extra is absent.
      # `slow` (the exhaustive crossover enumeration) is deselected here to keep PR
      # feedback fast; it gates on merge-to-main (docs.yml) and release (publish.yml).
      # `warrantlib` is measured alongside cpomdp. Its lines are exercised by this
      # suite, so leaving it out of the denominator would drop a published package off
      # the gate rather than reflect anything about how well it is tested.
      - name: pytest + coverage gate
        run: >-
          uv run --no-sync pytest -m "not rxinfer and not slow"
          -n auto --dist worksteal
          --cov=cpomdp --cov=warrantlib
          --cov-report=term-missing --cov-fail-under=80

  symbolic:
    name: symbolic suites (c₂ gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      # `cpomdp-research` is a workspace member in the default `dev` group, so a plain
      # sync installs it along with sympy and scipy. Nothing under `src/cpomdp` imports
      # either of those.
      - run: uv sync --locked
      # `ty` covers `research/src` and `pytest` still does not (`testpaths = ["tests"]`),
      # so without this job a check that imports cleanly but no longer runs reaches main
      # and is found by hand or not at all.
      #
      # Each module already exits non-zero when an identity fires. The counts are pinned
      # on top of that, because a stage quietly dropped from `run_checks` removes its
      # checks without failing anything — the suite would go green by asking less.
      # Changing a count here is meant to be a deliberate edit, reviewed with the diff.
      - name: symbolic suites, counts pinned
        run: |
          set -uo pipefail
          status=0
          run_suite() {
            module=$1
            expected=$2
            echo "::group::$module"
            if ! output=$(uv run --no-sync python -m "research.checks.$module" --check 2>&1); then
              echo "::error::$module: a check fired"
              status=1
            fi
            echo "$output"
            summary=$(printf '%s\n' "$output" | grep -E '^[0-9]+ registered' || true)
            if [ "$summary" != "$expected" ]; then
              echo "::error::$module: expected '$expected', got '$summary'"
              status=1
            fi
            echo "::endgroup::"
          }
          run_suite series_kernel    "23 registered, 23 tested here, none fired"
          run_suite log_ratio_series "18 registered, 18 tested here, none fired"
          run_suite gap_series       "29 registered, 29 tested here, none fired"
          exit $status

  oracle:
    name: rxinfer oracle (Julia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --extra rxinfer
      # juliacall provisions its own Julia + RxInfer (per juliapkg.json) on first
      # import; cache the depot so only the first run pays the full download/build.
      - name: Cache Julia depot
        uses: actions/cache@v5
        with:
          path: ~/.julia
          key: julia-depot-${{ runner.os }}-${{ hashFiles('src/cpomdp/juliapkg.json') }}
          restore-keys: julia-depot-${{ runner.os }}-
      - name: pytest (rxinfer only)
        run: uv run --no-sync pytest -m rxinfer
