name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      # `examples` extra: `ty` covers `examples/`, so matplotlib and pillow have to be
      # resolvable or every demo import reads as missing.
      - run: uv sync --locked --extra examples
      # Cache the pre-commit hook environments, keyed on the config.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Run the same hooks contributors run locally (ruff lint + format + file
      # hygiene), so CI and pre-commit can never disagree. Fails if any hook would
      # change a file. The commit-msg hook isn't run here (no commit to check).
      - name: pre-commit
        run: uv run --extra examples pre-commit run --all-files --show-diff-on-failure
      # `--extra examples` here too, or a bare `uv run` re-syncs the environment back
      # to the default set and takes matplotlib out again.
      - name: ty (strict types)
        run: uv run --extra examples ty check

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # The pure-Python suite: no Julia installed, so this also proves the
      # rxinfer-marked tests deselect cleanly when the optional extra is absent.
      # `slow` (the exhaustive crossover enumeration) is deselected here to keep PR
      # feedback fast; it gates on merge-to-main (docs.yml) and release (publish.yml).
      - name: pytest + coverage gate
        run: >-
          uv run pytest -m "not rxinfer and not slow"
          --cov=cpomdp --cov-report=term-missing --cov-fail-under=80

  review:
    name: claude review
    needs: [lint, test]
    # `!cancelled()` drops the implicit all-needs-succeeded gate, so a red `test`
    # still reaches the review — that's the point, the failures go in the comment.
    # A red `lint` does block it: style noise would drown the real findings.
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.action == 'opened'
      && needs.lint.result == 'success'
      && needs.test.result != 'cancelled'
      && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read # `gh run view` on this run's own test logs
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR. Prioritise correctness bugs, broken invariants,
            and API-contract changes. Skip formatting and naming nits —
            those are handled by lint. Assert that the code changes
            reflect the checklist in any present `BUILD_PLAN.md` file.

            The test job finished with result: ${{ needs.test.result }}.
            If that is not `success`, run
            `gh run view ${{ github.run_id }} --log-failed` first and lead the
            review with the failures: name each failing test, point to the
            change in the diff that caused it, and say whether the test or the
            code is the thing that's wrong.

            Post the review with `gh pr comment`.
          claude_args: >-
            --max-turns 10 --allowed-tools "Bash(gh pr diff:*),Bash(gh pr
            view:*),Bash(gh pr comment:*),Bash(gh run view:*)"

  oracle:
    name: rxinfer oracle (Julia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --extra rxinfer
      # juliacall provisions its own Julia + RxInfer (per juliapkg.json) on first
      # import; cache the depot so only the first run pays the full download/build.
      - name: Cache Julia depot
        uses: actions/cache@v5
        with:
          path: ~/.julia
          key: julia-depot-${{ runner.os }}-${{ hashFiles('src/cpomdp/juliapkg.json') }}
          restore-keys: julia-depot-${{ runner.os }}-
      - name: pytest (rxinfer only)
        run: uv run pytest -m rxinfer
