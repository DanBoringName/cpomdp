[project]
name = "warrantlib"
version = "0.1.0"
description = "A vocabulary for how well a claim is warranted, kept separate from whether it held."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Inferogenesis" }]
maintainers = [{ name = "Inferogenesis", email = "hello@inferogenesis.com" }]
keywords = ["evidence", "provenance", "reproducibility", "falsification"]
classifiers = [
    # No "License ::" classifier: PEP 639 forbids pairing it with the SPDX
    # `license` expression above, and PyPI rejects the upload if both appear.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Empty on purpose.
dependencies = []

[project.urls]
Homepage = "https://github.com/inferogenesis/cpomdp"
Repository = "https://github.com/inferogenesis/cpomdp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warrantlib"]
